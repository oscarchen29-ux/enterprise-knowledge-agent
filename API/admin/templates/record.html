{% extends "base.html" %}
{% import "_macros.html" as m with context %}
{% block title %}編輯獎懲紀錄{% endblock %}
{% block content %}
<p class="crumb"><a href="{{ back }}">← 返回</a></p>
<div class="page-head">
  <h1>編輯獎懲紀錄 #{{ record.id }}</h1>
  <span class="muted">
    <a href="{{ url_for('student', student_id=record.student_id) }}">{{ record.student_id }} {{ record.name }}</a>
  </span>
</div>

<section class="card">
  <form method="post">
    <input type="hidden" name="next" value="{{ back }}">
    <div class="grid">
      <label><span>日期</span><input type="date" name="record_date" value="{{ form.record_date }}" required></label>
      <label><span>類別</span>{{ m.kind_select(form.kind) }}</label>
      <label><span>次數</span><input type="number" name="times" value="{{ form.times }}" min="1" max="3" required></label>
      <label class="wide"><span>事由</span><input name="reason" value="{{ form.reason }}" required maxlength="200"></label>
    </div>
    <div class="form-actions">
      <button class="btn primary">儲存</button>
      <a class="btn" href="{{ back }}">取消</a>
    </div>
  </form>
</section>
{% endblock %}
